[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrev"
version = "1.45"
description = "QRev - Python package for hydrologic data analysis"
requires-python = ">=3.8"
authors = [
    { name = "David S Mueller", email = "david@genesishydrotech.com" }
]
license = { text = "MIT" }
keywords = ["hydrology", "data-analysis", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numba>=0.56",
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "statsmodels>=0.13",
    "seaborn>=0.12",
]

[project.urls]
Homepage = "https://github.com/Sana-hammemi/qrevint"
Repository = "https://github.com/Sana-hammemi/qrevint.git"

[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.packages.find]
where = [".."]
include = ["qrev*"]
namespaces = true